name: Deploy Docs Vercel

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - ".github/workflows/vercel-deploy-docs.yml"

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build docs
        run: yarn build:docs

      - name: Install Vercel CLI
        run: npm install -g vercel@54.21.1

      - name: Pull Vercel environment
        working-directory: docs
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_DOCS_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}

      - name: Deploy docs to Vercel
        working-directory: docs
        run: |
          cp -r dist .vercel/output/static 2>/dev/null || true
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_DOCS_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
