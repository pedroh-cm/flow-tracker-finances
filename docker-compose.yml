# URLs dos MFEs usadas pelo browser (Module Federation carrega no cliente).
# localhost funciona porque as portas são expostas no host via ports:.
# Para deploy em produção, substitua pelas URLs públicas dos remotes.
services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MFE_AUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_MFE_DASHBOARD_URL=http://localhost:3002
      - NEXT_PUBLIC_MFE_TRANSACTIONS_URL=http://localhost:3003
      - NEXT_PUBLIC_MFE_INVESTMENTS_URL=http://localhost:3004
      - AUTH_SECRET=${AUTH_SECRET:-flowtrack-docker-secret}
    depends_on:
      - mfe-auth
      - mfe-dashboard
      - mfe-transactions
      - mfe-investments
    restart: unless-stopped
    networks:
      - flowtrack

  mfe-auth:
    build:
      context: .
      dockerfile: remotes/Dockerfile
      args:
        REMOTE_PACKAGE: "@flowtrack/mfe-auth"
        REMOTE_PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - flowtrack

  mfe-dashboard:
    build:
      context: .
      dockerfile: remotes/Dockerfile
      args:
        REMOTE_PACKAGE: "@flowtrack/mfe-dashboard"
        REMOTE_PORT: 3002
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks:
      - flowtrack

  mfe-transactions:
    build:
      context: .
      dockerfile: remotes/Dockerfile
      args:
        REMOTE_PACKAGE: "@flowtrack/mfe-transactions"
        REMOTE_PORT: 3003
    ports:
      - "3003:3003"
    restart: unless-stopped
    networks:
      - flowtrack

  mfe-investments:
    build:
      context: .
      dockerfile: remotes/Dockerfile
      args:
        REMOTE_PACKAGE: "@flowtrack/mfe-investments"
        REMOTE_PORT: 3004
    ports:
      - "3004:3004"
    restart: unless-stopped
    networks:
      - flowtrack

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - "4321:4321"
    restart: unless-stopped
    networks:
      - flowtrack

networks:
  flowtrack:
    driver: bridge
